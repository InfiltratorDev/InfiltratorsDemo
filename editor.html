<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="topbar">
    <button id="runBtn">Run</button>
    <button id="finishBtn">Finish</button>
    <button id="saveBtn">Save</button>
    <button id="openBtn">Open</button>
    <button id="cancelBtn" style="display:none;">Cancel</button>
  </div>

  <div id="editorContainer">
    <div id="toolbox">
      <h3>Toolbox</h3>
      <button class="tool" data-type="wall">Wall</button>
      <button class="tool" data-type="spawn">Spawn Point</button>
      <button class="tool" data-type="erase">Erase</button>
    </div>

    <canvas id="editorCanvas"></canvas>

    <div id="settings">
      <h3>Settings</h3>
      <label>Width: <input type="number" id="gridWidth" value="32"></label><br>
      <label>Height: <input type="number" id="gridHeight" value="32"></label><br>
      <button id="resizeBtn">Resize</button>
    </div>
  </div>

  <!-- Save Modal -->
  <div id="saveModal" class="modal">
    <div class="modal-content">
      <h3>Save Code</h3>
      <textarea id="saveOutput" readonly></textarea>
      <button id="copySave">Copy</button>
      <button class="closeModal">Close</button>
    </div>
  </div>

  <!-- Open Modal -->
  <div id="openModal" class="modal">
    <div class="modal-content">
      <h3>Open Code</h3>
      <textarea id="openInput"></textarea>
      <button id="loadOpen">Load</button>
      <button class="closeModal">Close</button>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
